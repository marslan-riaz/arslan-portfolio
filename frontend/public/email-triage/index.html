<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email triage</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d6f25c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia' font-size='20' fill='%2314160f'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/email-triage/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">T</span>
          <div class="brand-text">
            <strong>Triage</strong>
            <span>Free model</span>
          </div>
        </div>
        <p class="model" id="model">Jev</p>
        <div class="top-actions">
          <p class="progress" id="progress">Loading inbox…</p>
          <button type="button" class="run" id="run" disabled>Triage inbox</button>
        </div>
      </header>

      <p class="banner" id="banner" hidden></p>

      <div class="workspace">
        <section class="list-pane" aria-label="Inbox">
          <div class="filters" id="filters">
            <button type="button" data-filter="all" class="is-on" aria-pressed="true">
              All <span id="count-all">0</span>
            </button>
            <button type="button" data-filter="keep" aria-pressed="false">
              Keep <span id="count-keep">0</span>
            </button>
            <button type="button" data-filter="archive" aria-pressed="false">
              Archive <span id="count-archive">0</span>
            </button>
            <button type="button" data-filter="review" aria-pressed="false">
              Review <span id="count-review">0</span>
            </button>
          </div>
          <div class="list" id="list"></div>
        </section>

        <article class="letter-pane" id="letter" aria-label="Message"></article>
        <aside class="verdict-pane" id="verdict" aria-label="Classification"></aside>
      </div>

      <footer class="stats" id="stats">
        <div>
          <span>Model calls</span>
          <strong id="stat-calls">—</strong>
        </div>
        <div>
          <span>Input tokens</span>
          <strong id="stat-tokens">—</strong>
        </div>
        <div>
          <span>Cost</span>
          <strong id="stat-cost">—</strong>
        </div>
        <div>
          <span>Elapsed</span>
          <strong id="stat-time">—</strong>
        </div>
      </footer>
    </div>
    <script>
      window.TRIAGE_API =
        location.hostname === "localhost" || location.hostname === "127.0.0.1"
          ? "http://localhost:4000"
          : "https://arslan-portfolio-z4gd.onrender.com";
    </script>
    <script src="/email-triage/app.js" type="module"></script>
  </body>
</html>
